name: Validate builder

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: bash -n build-image.sh
      - run: python -m py_compile scripts/*.py
      - run: mvn -B -ntp -f java-dependencies/pom.xml validate
      - run: docker buildx build --check .
